<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'" />
  <title>Review Transcript</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      padding: var(--space-4);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }
    .header-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--state-reviewing);
    }
    .header-icon svg { width: 15px; height: 15px; }
    .header-title {
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: -0.01em;
    }

    #warning { margin-bottom: var(--space-3); }

    textarea {
      flex: 1;
      resize: none;
      padding: var(--space-3);
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    #status { font-size: 11px; color: var(--state-success); margin-left: auto; }

    .hint-row { margin-top: var(--space-3); }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>
      </svg>
    </span>
    <span class="header-title">Review Transcript</span>
  </div>

  <div id="warning" class="banner" hidden></div>

  <textarea id="transcript-edit" spellcheck="false"></textarea>

  <div class="actions">
    <button id="btn-insert" class="primary" title="Ctrl+Enter">Insert</button>
    <button id="btn-copy" class="ghost" title="Ctrl+Shift+C">Copy</button>
    <button id="btn-retry" class="ghost" title="Ctrl+Shift+R">Retry</button>
    <button id="btn-cancel" class="ghost" title="Esc">Cancel</button>
    <span id="status"></span>
  </div>

  <div class="hint-row">
    <kbd>Ctrl+Enter</kbd> Insert
    <kbd>Esc</kbd> Cancel
    <kbd>Ctrl+Shift+C</kbd> Copy
    <kbd>Ctrl+Shift+R</kbd> Retry
  </div>

  <script src="review-renderer.js"></script>
</body>
</html>
